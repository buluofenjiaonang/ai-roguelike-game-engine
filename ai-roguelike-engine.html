var H = 720;
canvas.width = W;
canvas.height = H;

function resize() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
}
resize();
addEventListener('resize', resize);

// ── Utilities ──────────────────────────────────────────────
function rand(a, b) {
    return Math.random() * (b - a) + a;
}
function randInt(a, b) {
    return Math.floor(rand(a, b + 1));
}
function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
}
function lerp(a, b, t) {
    return a + (b - a) * t;
}

// ── Text Helper (with outline for readability) ─────────────
function drawText(text, x, y, color, size, align) {
    ctx.save();
    ctx.font = 'bold ' + size + 'px "ZCOOL KuaiLe"';
    ctx.textAlign = align || 'center';
    if (size >= 10) {
        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.lineWidth = Math.max(2, Math.floor(size / 5));
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
}

// ── Audio ──────────────────────────────────────────────────
var audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    var t = audioCtx.currentTime;
    var cfg = {
        hit:     ['sawtooth', 200, 80,  0.12, 0.12],
        slash:   ['square',   900, 300, 0.07, 0.07],
        skill:   ['sine',     400, 1200,0.09, 0.22],
        boom:    ['sawtooth', 150, 30,  0.14, 0.32],
        lvl:     ['sine',     523, 1047,0.09, 0.45],
        pick:    ['sine',     600, 1200,0.05, 0.09],
        die:     ['sawtooth', 300, 50,  0.11, 0.45],
        boss:    ['square',   100, 80,  0.09, 0.30],
        freeze:  ['sine',     1200,400, 0.09, 0.25],
        rev:     ['sine',     392, 784, 0.09, 0.40],
        sel:     ['sine',     700, 1100,0.06, 0.08]
    };
    var d = cfg[type] || cfg.hit;
    o.type = d[0];
    o.frequency.setValueAtTime(d[1], t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, d[2]), t + d[4]);
    g.gain.setValueAtTime(d[3], t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d[4]);
    o.start(t);
    o.stop(t + d[4]);
}

// ── Input ──────────────────────────────────────────────────
var keys = {};
var justPressed = {};

addEventListener('keydown', function(e) {
    if (!keys[e.code]) {
        justPressed[e.code] = true;
    }
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) {
        e.preventDefault();
    }
});
addEventListener('keyup', function(e) {
    keys[e.code] = false;
});

function wasPressed(code) {
    var v = justPressed[code];
    justPressed[code] = false;
    return v;
}

function saveGame() {
    if (!player) return;
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            cy: cycle,
            st: stage,
            lv: player.level,
            exp: player.exp,
            en: player.expToNext,
            gld: player.gold,
            sc: score,
            mc: maxCombo,
            abs: player.abilityStacks
        }));
    } catch (e) { /* ignore */ }
}

function loadSave() {
    try {
        var d = localStorage.getItem(SAVE_KEY);
        return d ? JSON.parse(d) : null;
    } catch (e) {
        return null;
    }
}

function hasSave() {
    return loadSave() !== null;
}

var cam = { x: 0, y: 0 };

function updateCam(target) {
    var tx = target.x - W / 2 + target.facing * 80;
    var ty = target.y - H / 2 + 60;
    cam.x = lerp(cam.x, clamp(tx, 0, (currentLevel ? currentLevel.width : W) - W), 0.06);
    cam.y = lerp(cam.y, clamp(ty, -100, 200), 0.06);
}

// ── Particle System ────────────────────────────────────────
function Particle(x, y, vx, vy, c, sz, life, type) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.c = c;
    this.sz = sz;
    this.life = life;
    this.maxLife = life;
    this.type = type || 'c';
    this.grav = 0.1;
    this.fric = 0.98;
    this.txt = '';
}

Particle.prototype.update = function() {
    this.vx *= this.fric;
    this.vy *= this.fric;
    this.vy += this.grav;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    return this.life > 0;
};

Particle.prototype.draw = function() {
    var a = this.life / this.maxLife;
    var sx = this.x - cam.x;
    var sy = this.y - cam.y;
    if (sx < -60 || sx > W + 60) return;
    ctx.save();
    ctx.globalAlpha = a;
    if (this.type === 'c') {
        ctx.fillStyle = this.c;
        ctx.beginPath();
        ctx.arc(sx, sy, this.sz * a, 0, Math.PI * 2);
        ctx.fill();
    } else if (this.type === 't') {
        drawText(this.txt, sx, sy, this.c, this.sz);
    }
    ctx.restore();
};

function spawnP(x, y, c, n, spd, sz, life, opts) {
    opts = opts || {};
    for (var i = 0; i < n; i++) {
        var a = rand(0, Math.PI * 2);
        var s = rand(0.3, spd);
        var p = new Particle(
            x + rand(-3, 3), y + rand(-3, 3),
            Math.cos(a) * s, Math.sin(a) * s,
            c, sz * 0.5 + rand(0, sz * 0.5),
            life * 0.5 + rand(0, life * 0.5),
            opts.type || 'c'
        );
        p.grav = opts.grav !== undefined ? opts.grav : 0.1;
        p.fric = opts.fric !== undefined ? opts.fric : 0.98;
        particles.push(p);
    }
}

function spawnText(x, y, txt, c, sz) {
    var p = new Particle(x, y, 0, -1.5, c, sz, 70, 't');
    p.txt = txt;
    p.grav = 0;
    p.fric = 1;
    particles.push(p);
}

function applyFx(p, fx) {
    for (var k in fx) {
        var v = fx[k];
        if (k === 'dj')  { p.canDJ = true; continue; }
        if (k === 'ke')  { p.killExp = true; continue; }
        if (k === 'rv')  { p.canRev = true; continue; }
        if (k === 'sh')  { p.hasShield = true; continue; }
        if (k === 'sr')  { p.hasSR = true; continue; }
        if (k === 'ai')  { p.hasAI = true; continue; }
        if (k === 'fa')  { p.hasFA = true; continue; }
        if (k === 'spd') { p.moveSpeed *= (1 + v); continue; }
        if (k === 'jp')  { p.jpPow *= (1 + v); continue; }
        if (k === 'mhp') { p.maxHp += v; p.hp += v; continue; }
        if (k === 'mmp') { p.maxMp += v; p.mp += v; continue; }
        if (k === 'atk') { p.bAtk += v; continue; }
        if (k === 'def') { p.bDef += v; continue; }
        p[k] = (p[k] || 0) + v;
    }
}

function pickAbils() {
    var pool = ABILITIES.slice();
    var chosen = [];
    for (var i = 0; i < 3 && pool.length > 0; i++) {
        var tw = 0;
        for (var j = 0; j < pool.length; j++) tw += pool[j].w;
        var r = rand(0, tw);
        var picked = null;
        for (var j = 0; j < pool.length; j++) {
            r -= pool[j].w;
            if (r <= 0) {
                picked = pool.splice(j, 1)[0];
                break;
            }
        }
        if (picked) chosen.push(picked);
        else if (pool.length > 0) chosen.push(pool.splice(0, 1)[0]);
    }
    return chosen;
}

// ── Level Class ────────────────────────────────────────────
function Level(d) {
    this.width = d.width;
    this.name = d.name;
    this.theme = d.theme;
    this.bg1 = d.bg1;
    this.bg2 = d.bg2;
    this.sx = d.sx;
    this.sy = d.sy;
    this.bossD = d.boss;
    this.plats = d.plats.map(function(p) {
        return { x: p[0], y: p[1], w: p[2], h: p[3] };
    });
    this.waves = d.waves || [];
    this.wi = 0;
    this.bossed = false;
    this.cleared = false;
    this.clouds = [];
    for (var i = 0; i < 10; i++) {
        this.clouds.push({
            x: rand(0, this.width),
            y: rand(40, 260),
            w: rand(90, 250),
            s: rand(0.12, 0.4)
        });
    }
}

Level.prototype.drawBG = function() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, this.bg1);
    g.addColorStop(1, this.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = 'rgba(255,255,200,0.3)';
    for (var i = 0; i < 70; i++) {
        var sx = ((i * 137.5 + cam.x * 0.07) % W + W) % W;
        var sy = (i * 73.1) % 360;
        ctx.beginPath();
        ctx.arc(sx, sy, 0.7 + Math.sin(gameTime * 0.02 + i) * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Parallax far
    ctx.save();
    ctx.globalAlpha = 0.1;
    for (var i = 0; i < 7; i++) {
        var mx = i * 320 - (cam.x * 0.1) % 320;
        ctx.fillStyle = this.theme === 'fire' ? '#5a1a0a' : '#4a2a6a';
        ctx.beginPath();
        ctx.moveTo(mx, H);
        ctx.lineTo(mx + 90, H - 200 - Math.sin(i) * 35);
        ctx.lineTo(mx + 320, H);
        ctx.fill();
    }
    ctx.globalAlpha = 0.18;
    for (var i = 0; i < 9; i++) {
        var mx = i * 260 - (cam.x * 0.22) % 260;
        if (mx < -250 || mx > W + 250) continue;
        if (this.theme === 'garden') {
            ctx.fillStyle = '#1a3a1a';
            ctx.fillRect(mx + 95, H - 170, 14, 170);
            ctx.beginPath(); ctx.arc(mx + 102, H - 190, 40, 0, Math.PI * 2); ctx.fill();
        } else if (this.theme === 'fire') {
            ctx.fillStyle = '#3a0a0a';
            ctx.fillRect(mx + 85, H - 150, 55, 150);
        } else if (this.theme === 'ocean') {
            ctx.fillStyle = '#0a2a4a';
            ctx.fillRect(mx + 75, H - 190, 35, 190);
        } else {
            ctx.fillStyle = '#3a1a5a';
            ctx.fillRect(mx + 75, H - 220, 45, 220);
            ctx.beginPath();
            ctx.moveTo(mx + 55, H - 220);
            ctx.lineTo(mx + 97, H - 270);
            ctx.lineTo(mx + 140, H - 220);
            ctx.fill();
        }
    }
    ctx.restore();

    // Clouds
    var self = this;
    this.clouds.forEach(function(c) {
        c.x += c.s;
        if (c.x > self.width + 280) c.x = -250;
        var sx = c.x - cam.x * 0.2;
        var sy = c.y - cam.y * 0.07;
        if (sx > -260 && sx < W + 260) {
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(sx, sy, c.w / 2, 22, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    });
};

Level.prototype.drawPlats = function() {
    this.plats.forEach(function(p) {
        var sx = p.x - cam.x;
        var sy = p.y - cam.y;
        if (sx > W + 50 || sx + p.w < -50) return;
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.roundRect(sx + 3, sy + 3, p.w, p.h, 3);
        ctx.fill();
        var g = ctx.createLinearGradient(sx, sy, sx, sy + p.h);
        g.addColorStop(0, '#6b5b4b');
        g.addColorStop(0.3, '#5a4a3a');
        g.addColorStop(1, '#3a2a1a');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(sx, sy, p.w, p.h, 3);
        ctx.fill();
        ctx.fillStyle = '#8a7a6a';
        ctx.fillRect(sx, sy, p.w, 4);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        for (var r = 0; r < p.h / 17; r++) {
            var off = r % 2 ? 17 : 0;
            for (var c = -1; c < p.w / 34 + 1; c++) {
                ctx.strokeRect(sx + c * 34 + off, sy + r * 17, 34, 17);
            }
        }
        ctx.restore();
    });
};

Level.prototype.updateWaves = function() {
    if (this.cleared) return;
    if (this.wi >= this.waves.length) {
        if (!this.bossed && this.bossD) {
            this.bossed = true;
            spawnEnemy(this.bossD.t, this.bossD.x, this.bossD.y, true);
        }
        return;
    }
    var w = this.waves[this.wi];
    if (w.c === 'k' && enemies.length === 0) {
        this.wi++;
        if (this.wi < this.waves.length && this.waves[this.wi].s) {
            var nextWave = this.waves[this.wi];
            nextWave.s.forEach(function(s) { spawnEnemy(s.t, s.x, s.y); });
        }
    } else if (w.c === 'x' && player.x >= w.x) {
        w.s.forEach(function(s) { spawnEnemy(s.t, s.x, s.y); });
        this.wi++;
    }
};

// ── Color Helpers ──────────────────────────────────────────
function dk(hex, f) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgb(' + (r * f | 0) + ',' + (g * f | 0) + ',' + (b * f | 0) + ')';
}

function lt(hex, f) {
    var r = Math.min(255, parseInt(hex.slice(1, 3), 16) * f);
    var g = Math.min(255, parseInt(hex.slice(3, 5), 16) * f);
    var b = Math.min(255, parseInt(hex.slice(5, 7), 16) * f);
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

// ── Enemy Class ────────────────────────────────────────────
function Enemy(type, x, y, isBoss) {
    var d = EDEF[type];
    var hm = 1 + cycle * 0.5;
    var am = 1 + cycle * 0.35;
    this.type = type;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.w = d.w;
    this.h = d.h;
    this.col = d.c;
    this.rng = d.rng || 50;
    this.fl = d.fl || false;
    this.rg = d.rg || false;
    this.boss = d.boss || false;
    this.name = d.n;
    this.hp = Math.floor(d.hp * hm);
    this.maxHp = this.hp;
    this.atk = Math.floor(d.atk * am);
    this.spd = d.spd;
    this.exp = Math.floor(d.exp * (1 + cycle * 0.25));
    this.gold = Math.floor(d.gld * (1 + cycle * 0.2));
    this.facing = -1;
    this.frame = 0;
    this.atkCd = 0;
    this.hurtT = 0;
    this.aiT = 0;
    this.aiSt = 'p';
    this.pDir = Math.random() > 0.5 ? 1 : -1;
    this.stX = x;
    this.phase = 1;
    this.frozen = 0;
}

Enemy.prototype.update = function() {
    this.frame++;
    if (this.atkCd > 0) this.atkCd--;
    if (this.hurtT > 0) this.hurtT--;
    if (this.frozen > 0) { this.frozen--; return; }
    this.aiT++;

    var dx = player.x - this.x;
    var dist = Math.abs(dx);
    var dir = dx > 0 ? 1 : -1;
    var sm = 1;
    if (player.sA > 0 && dist < 200) sm = 1 - player.sA;

    // Boss phase transition
    if (this.boss && this.hp < this.maxHp * 0.5 && this.phase === 1) {
        this.phase = 2;
        this.atk = Math.floor(this.atk * 1.3);
        this.spd *= 1.15;
        sFlash = 6;
        sFlashC = '#ff0000';
        spawnText(this.x, this.y - 50, this.name + ' 狂暴!', '#ff4444', 18);
        playSound('boss');
    }

    if (this.fl) {
        // Flying enemy
        if (dist < 420) {
            this.vx = lerp(this.vx, dir * this.spd * sm, 0.035);
            var ty = player.y - 70 + Math.sin(this.frame * 0.04) * 22;
            this.vy = lerp(this.vy, (ty - this.y) * 0.012, 0.07);
            this.facing = dir;
            if (dist < this.rng && this.atkCd <= 0) this.doAtk();
        } else {
            this.vx *= 0.95;
            this.vy *= 0.95;
        }
    } else {
        // Ground enemy
        this.aiSt = dist < 360 ? 'c' : 'p';
        if (this.aiSt === 'c') {
            if (dist > this.rng) {
                this.vx = lerp(this.vx, dir * this.spd * sm, 0.1);
            } else {
                this.vx *= 0.7;
                if (this.atkCd <= 0) this.doAtk();
            }
            this.facing = dir;
        } else {
            if (this.aiT % 150 === 0) this.pDir *= -1;
            this.vx = lerp(this.vx, this.pDir * this.spd * 0.35 * sm, 0.07);
            this.facing = this.pDir;
            if (Math.abs(this.x - this.stX) > 160) {
                this.pDir = this.x > this.stX ? -1 : 1;
            }
        }
        this.vy += 0.42;
        if (this.vy > 11) this.vy = 11;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Platform collision
    if (!this.fl) {
        var self = this;
        currentLevel.plats.forEach(function(p) {
            if (self.vy >= 0 && self.x + self.w / 2 > p.x && self.x - self.w / 2 < p.x + p.w) {
                if (self.y + self.h / 2 >= p.y && self.y + self.h / 2 - self.vy <= p.y + 8) {
                    self.y = p.y - self.h / 2;
                    self.vy = 0;
                }
            }
        });
    }

    this.x = clamp(this.x, this.w / 2, currentLevel.width - this.w / 2);
    if (this.y > 700) this.y = 0;

    // Update enemy projectiles
    for (var i = eProjs.length - 1; i >= 0; i--) {
        var p = eProjs[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (Math.abs(p.x - player.x) < 26 && Math.abs(p.y - player.y) < 36) {
            player.takeDmg(p.dmg);
            eProjs.splice(i, 1);
        } else if (p.life <= 0) {
            eProjs.splice(i, 1);
        }
    }
};

Enemy.prototype.doAtk = function() {
    this.atkCd = this.boss ? 55 : 95;
    if (this.rg) {
        var dx = player.x - this.x;
        var dy = player.y - this.y;
        var d = Math.hypot(dx, dy) || 1;
        var sp = this.boss ? 3.5 : 2.2;
        var c = '#ff0000';
        if (this.type === 'fire' || this.type === 'redboy') c = '#ff4500';
        else if (this.type === 'dragon') c = '#00aaff';
        else if (this.type === 'spider') c = '#8800aa';
        eProjs.push({
            x: this.x, y: this.y - 10,
            vx: dx / d * sp, vy: dy / d * sp,
            dmg: this.atk, life: 120, col: c, sz: this.boss ? 8 : 5
        });
        if (this.boss && this.phase === 2) {
            for (var i = -2; i <= 2; i++) {
                if (i === 0) continue;
                var a = Math.atan2(dy, dx) + i * 0.2;
                eProjs.push({
                    x: this.x, y: this.y - 10,
                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    dmg: Math.floor(this.atk * 0.7), life: 120, col: c, sz: 6
                });
            }
        }
    } else {
        if (Math.abs(this.x - player.x) < this.rng + 26 && Math.abs(this.y - player.y) < 42) {
            player.takeDmg(this.atk);
        }
    }
};

Enemy.prototype.takeDmg = function(dmg) {
    var fd = dmg;
    var crit = player.critR > 0 && Math.random() < player.critR;
    if (crit) {
        fd = Math.floor(fd * player.critD);
        spawnText(this.x, this.y - this.h / 2 - 18, '暴击!', '#ff8800', 14);
    }
    fd = Math.floor(fd * (1 + (player.cBns || 0) * (combo / 10)));
    fd = Math.max(1, fd);
    this.hp -= fd;
    this.hurtT = 6;
    spawnText(this.x + rand(-10, 10), this.y - this.h / 2 - 5, '-' + fd, crit ? '#ff8800' : '#ffff00', crit ? 17 : 14);
    spawnP(this.x, this.y, '#ff4444', 3, 2, 2, 12);

    // Lifesteal
    var tls = (player.ls || 0) + (player.bloodT > 0 ? 0.2 : 0);
    if (tls > 0) {
        player.hp = Math.min(player.maxHp, player.hp + Math.floor(fd * tls));
    }

    // Ice slow
    if (player.ice > 0 && Math.random() < 0.5) {
        var os = EDEF[this.type].spd;
        var self = this;
        this.spd = os * 0.7;
        setTimeout(function() { self.spd = os; }, 2000);
    }

    // Fire dot
    if (player.fire > 0 && Math.random() < 0.4) {
        var tk = 3;
        var self = this;
        var iv = setInterval(function() {
            if (tk-- <= 0 || self.hp <= 0) { clearInterval(iv); return; }
            self.hp -= Math.floor(fd * 0.15);
            spawnP(self.x, self.y, '#ff6600', 3, 2, 2, 10);
            if (self.hp <= 0) self.die();
        }, 500);
    }

    // Lightning chain
    if (player.lit > 0 && Math.random() < player.lit) {
        var self = this;
        enemies.filter(function(e) {
            return e !== self && Math.abs(e.x - self.x) < 150;
        }).slice(0, 2).forEach(function(e) {
            e.takeDmg(Math.floor(fd * 0.4));
            spawnP(e.x, e.y, '#aaddff', 5, 3, 3, 12);
        });
    }

    if (this.hp <= 0) this.die();
};

Enemy.prototype.die = function() {
    playSound('boom');
    var dm = 1 + (player.dR || 0);
    if (Math.random() < 0.3 * dm) items.push(new Item(this.x, this.y, 'hp'));
    if (Math.random() < 0.2 * dm) items.push(new Item(this.x + 10, this.y, 'mp'));
    if (Math.random() < 0.15 * dm) items.push(new Item(this.x - 10, this.y, 'gold'));
    player.gainExp(this.exp);
    player.gold += Math.floor(this.gold * (1 + (player.gM || 0)));
    score += this.exp * 10;
    combo++;
    comboTimer = 120;
    if (combo > maxCombo) maxCombo = combo;
    spawnP(this.x, this.y, this.col, 12, 4, 4, 22);
    spawnText(this.x, this.y - this.h / 2 - 15, '+' + this.exp + ' EXP', '#00ff88', 13);

    // Kill explosion
    if (player.killExp) {
        var self = this;
        enemies.filter(function(e) {
            return e !== self && Math.abs(e.x - self.x) < 100;
        }).forEach(function(e) {
            e.takeDmg(Math.floor(self.maxHp * 0.3));
        });
        spawnP(this.x, this.y, '#ff8800', 15, 5, 5, 20);
    }

    if (this.boss) {
        sShake = 15;
        sFlash = 10;
        sFlashC = '#ffd700';
        for (var i = 0; i < 30; i++) {
            spawnP(this.x + rand(-30, 30), this.y + rand(-30, 30),
                ['#ffd700', '#ff8c00', '#fff'][randInt(0, 2)],
                1, rand(3, 7), rand(3, 6), rand(20, 45));
        }
        currentLevel.cleared = true;
        saveGame();
    }

    var idx = enemies.indexOf(this);
    if (idx >= 0) enemies.splice(idx, 1);
};

Enemy.prototype.draw = function() {
    var sx = this.x - cam.x;
    var sy = this.y - cam.y;
    if (sx < -80 || sx > W + 80) return;

    ctx.save();
    if (this.frozen > 0) {
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#88ccff';
        ctx.beginPath();
        ctx.roundRect(sx - this.w / 2 - 2, sy - this.h / 2 - 2, this.w + 4, this.h + 4, 6);
        ctx.fill();
    }
    if (this.hurtT > 0 && this.hurtT % 2 === 0) ctx.globalAlpha = 0.4;

    var b = Math.sin(this.frame * 0.1) * 1.5;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + this.h / 2, this.w / 2 - 2, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    if (this.boss) {
        this.drawBoss(sx, sy + b);
    } else {
        this.drawNorm(sx, sy + b);
    }
    ctx.restore();

    // HP bar
    if (this.hp < this.maxHp || this.boss) {
        var bw = this.boss ? 100 : 34;
        var bh = this.boss ? 6 : 3;
        var bx = sx - bw / 2;
        var by = sy - this.h / 2 - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
        ctx.fillStyle = '#222';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = this.boss ? '#ee3333' : '#cc0000';
        ctx.fillRect(bx, by, bw * (this.hp / this.maxHp), bh);
    }
    if (this.boss) {
        drawText(this.name, sx, sy - this.h / 2 - 19, '#ff6666', 13);
    }
};

Enemy.prototype.drawNorm = function(sx, sy) {
    var f = this.facing;
    var la = this.aiSt === 'c' ? Math.sin(this.frame * 0.22) * 0.3 : 0;

    // Legs
    for (var s = -1; s <= 1; s += 2) {
        ctx.save();
        ctx.translate(sx + s * 5 * f, sy + this.h / 4);
        ctx.rotate(s === -1 ? la : -la);
        ctx.fillStyle = dk(this.col, 0.7);
        ctx.fillRect(-3, 0, 6, this.h / 3);
        ctx.restore();
    }

    // Body
    var bg = ctx.createLinearGradient(sx - this.w / 2, sy - this.h / 3, sx + this.w / 2, sy + this.h / 3);
    bg.addColorStop(0, lt(this.col, 1.12));
    bg.addColorStop(1, this.col);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(sx - this.w / 2, sy - this.h / 3, this.w, this.h * 0.6, 5);
    ctx.fill();
    ctx.strokeStyle = lt(this.col, 1.3);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(sx - this.w / 2, sy - this.h / 3, this.w, this.h * 0.6, 5);
    ctx.stroke();

    // Type specific
    if (this.type === 'soldier') {
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.roundRect(sx - 8, sy - this.h / 2.4, 16, 10, 3);
        ctx.fill();
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx + f * 13, sy - 4);
        ctx.lineTo(sx + f * 28, sy - 25);
        ctx.stroke();
    } else if (this.type === 'fire') {
        ctx.globalAlpha = 0.3;
        for (var i = 0; i < 3; i++) {
            ctx.fillStyle = ['#ff4500', '#ff6600', '#ff8800'][i];
            ctx.beginPath();
            ctx.arc(sx + rand(-5, 5), sy - this.h / 3 + rand(-7, 3), rand(5, 10), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Head
    ctx.fillStyle = lt(this.col, 1.25);
    ctx.beginPath();
    ctx.arc(sx, sy - this.h / 3 - 6, 8, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(sx + f * 3, sy - this.h / 3 - 8, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx + f * 8, sy - this.h / 3 - 8, 1.8, 0, Math.PI * 2);
    ctx.fill();
};

Enemy.prototype.drawBoss = function(sx, sy) {
    var f = this.facing;
    var pulse = Math.sin(this.frame * 0.04) * 2;

    // Aura
    ctx.globalAlpha = 0.12 + this.phase * 0.06;
    ctx.fillStyle = this.phase === 2 ? '#ff0000' : this.col;
    ctx.beginPath();
    ctx.arc(sx, sy, this.w + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Legs
    ctx.fillStyle = dk(this.col, 0.6);
    ctx.fillRect(sx - 13, sy + 10, 10, this.h / 2.5);
    ctx.fillRect(sx + 3, sy + 10, 10, this.h / 2.5);

    // Body
    var bg = ctx.createLinearGradient(sx - this.w / 2, sy - this.h / 3, sx + this.w / 2, sy + this.h / 3);
    bg.addColorStop(0, lt(this.col, 1.15));
    bg.addColorStop(0.5, this.col);
    bg.addColorStop(1, dk(this.col, 0.8));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(sx - this.w / 2, sy - this.h / 3, this.w, this.h * 0.65, 8);
    ctx.fill();
    ctx.strokeStyle = lt(this.col, 1.3);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(sx - this.w / 2, sy - this.h / 3, this.w, this.h * 0.65, 8);
    ctx.stroke();

    // Boss-specific
    if (this.type === 'bull') {
        ctx.fillStyle = '#DAA520';
        ctx.beginPath();
        ctx.moveTo(sx - 10, sy - this.h / 3);
        ctx.lineTo(sx - 20, sy - this.h / 2 - 15);
        ctx.lineTo(sx - 6, sy - this.h / 3 + 3);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + 10, sy - this.h / 3);
        ctx.lineTo(sx + 20, sy - this.h / 2 - 15);
        ctx.lineTo(sx + 6, sy - this.h / 3 + 3);
        ctx.fill();
    }

    // Head
    ctx.fillStyle = lt(this.col, 1.25);
    ctx.beginPath();
    ctx.arc(sx, sy - this.h / 3 - 3, 12, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = this.phase === 2 ? '#ff0000' : '#fff';
    ctx.beginPath();
    ctx.arc(sx + f * 4, sy - this.h / 3 - 6, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx + f * 10, sy - this.h / 3 - 6, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = this.phase === 2 ? '#fff' : '#111';
    ctx.beginPath();
    ctx.arc(sx + f * 4, sy - this.h / 3 - 6, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx + f * 10, sy - this.h / 3 - 6, 1.5, 0, Math.PI * 2);
    ctx.fill();

    if (this.hurtT > 0) {
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.roundRect(sx - this.w / 2, sy - this.h / 3, this.w, this.h * 0.65, 8);
        ctx.fill();
    }
};

function spawnEnemy(type, x, y, isBoss) {
    enemies.push(new Enemy(type, x, y, isBoss));
    if (isBoss) {
        playSound('boss');
        sFlash = 5;
        sFlashC = '#ff0000';
    }
}

// ── Player Class ───────────────────────────────────────────
function Player(x, y, lv) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.w = 34;
    this.h = 56;
    this.facing = 1;
    this.grounded = false;
    this.state = 'idle';
    this.frame = 0;
    this.level = lv || 1;
    this.maxHp = 100 + (this.level - 1) * 8;
    this.hp = this.maxHp;
    this.maxMp = 50 + (this.level - 1) * 4;
    this.mp = this.maxMp;
    this.baseAtk = 15 + (this.level - 1) * 2;
    this.baseDef = 5 + (this.level - 1);
    this.moveSpeed = 1.8;
    this.jpPow = 10;
    this.exp = 0;
    this.expToNext = Math.floor(100 * Math.pow(1.35, this.level - 1));
    this.gold = 0;
    this.atkCd = 0;
    this.atkCombo = 0;
    this.atkCT = 0;
    this.hurtT = 0;
    this.invT = 0;
    this.dashT = 0;
    this.dashCd = 0;
    this.atkHit = [];
    this.faCount = 0;
    // Ability stats
    this.critR = 0;
    this.critD = 1.5;
    this.ls = 0;
    this.dodge = 0;
    this.dRed = 0;
    this.atkR = 0;
    this.atkS = 0;
    this.pen = 0;
    this.cBns = 0;
    this.aoe = 0;
    this.fire = 0;
    this.ice = 0;
    this.lit = 0;
    this.dh = 0;
    this.thorn = 0;
    this.rDef = 0;
    this.rA = 0;
    this.undy = 0;
    this.eM = 0;
    this.gM = 0;
    this.hpR = 0;
    this.mpR = 0;
    this.cdr = 0;
    this.dR = 0;
    this.pR = 60;
    this.sA = 0;
    this.bAtk = 0;
    this.bDef = 0;
    // Booleans
    this.canDJ = false;
    this.hasDJ = false;
    this.killExp = false;
    this.canRev = false;
    this.revUsed = false;
    this.hasShield = false;
    this.shCd = 0;
    this.shOn = false;
    this.shHP = 0;
    this.hasSR = false;
    this.srCd = 0;
    this.hasAI = false;
    this.hasFA = false;
    // Skill timers (ticks, 60 = 1 second)
    this.diamondT = 0;   // 金刚不坏: 600 ticks = 10s
    this.bloodT = 0;     // 饮血剑气: 600 ticks = 10s
    this.orbitOn = false;
    this.orbitT = 0;     // 剑气环绕: 480 ticks = 8s
    this.orbitAng = 0;
    this.skySword = null;
    this.abilityStacks = {};
    this.skills = [
        { n: '天降神剑', k: 'KeyZ', cd: 0, mc: 180, mp: 10 },
        { n: '剑气环绕', k: 'KeyX', cd: 0, mc: 300, mp: 18 },
        { n: '金刚不坏', k: 'KeyC', cd: 0, mc: 600, mp: 22 },
        { n: '定身术',   k: 'KeyV', cd: 0, mc: 420, mp: 20 },
        { n: '饮血剑气', k: 'KeyB', cd: 0, mc: 600, mp: 35 }
    ];
}

Player.prototype.getAtk = function() {
    var a = this.baseAtk + this.bAtk;
    if (this.bloodT > 0) a *= 1.3;
    if (this.rA > 0 && this.hp < this.maxHp * 0.4) a *= (1 + this.rA);
    return Math.floor(a);
};

Player.prototype.getDef = function() {
    var d = this.baseDef + this.bDef;
    if (this.diamondT > 0) d *= 1.5;
    if (this.rDef > 0 && this.hp < this.maxHp * 0.3) d *= (1 + this.rDef);
    return Math.floor(d);
};

Player.prototype.update = function() {
    this.frame++;
    if (this.atkCd > 0) this.atkCd--;
    if (this.atkCT > 0) { this.atkCT--; if (this.atkCT <= 0) this.atkCombo = 0; }
    if (this.hurtT > 0) this.hurtT--;
    if (this.invT > 0) this.invT--;
    if (this.dashT > 0) this.dashT--;
    if (this.dashCd > 0) this.dashCd--;
    for (var i = 0; i < this.skills.length; i++) {
        if (this.skills[i].cd > 0) this.skills[i].cd--;
    }

    // Regen (every 2 seconds = 120 ticks)
    if (gameTime % 120 === 0) {
        if (this.hpR) this.hp = Math.min(this.maxHp, this.hp + this.hpR);
        if (this.mpR) this.mp = Math.min(this.maxMp, this.mp + this.mpR);
    }
    if (gameTime % 80 === 0 && this.mp < this.maxMp) {
        this.mp = Math.min(this.mp + 1, this.maxMp);
    }

    // Shield (every 20s = 1200 ticks)
    if (this.hasShield) {
        this.shCd--;
        if (this.shCd <= 0 && !this.shOn) {
            this.shOn = true;
            this.shHP = 40 + this.level * 3;
            this.shCd = 1200;
        }
    }

    // Sword rain (every 8s = 480 ticks)
    if (this.hasSR) {
        this.srCd--;
        if (this.srCd <= 0) {
            this.srCd = 480;
            for (var i = 0; i < 8; i++) {
                sProjs.push({
                    x: this.x + rand(-200, 200), y: this.y - 300,
                    vx: rand(-0.5, 0.5), vy: 8,
                    dmg: Math.floor(this.getAtk() * 0.5),
                    life: 60, ml: 60, facing: 1, sz: 14, hit: {}
                });
            }
        }
    }

    // Attack hitboxes
    for (var i = this.atkHit.length - 1; i >= 0; i--) {
        this.atkHit[i].life--;
        if (this.atkHit[i].life <= 0) this.atkHit.splice(i, 1);
    }

    // Sky sword
    if (this.skySword) {
        var s = this.skySword;
        s.y += s.spd;
        if (s.y >= s.ty) {
            s.y = s.ty;
            s.impact++;
            if (s.impact === 1) {
                sShake = 12;
                spawnP(s.x, s.y, '#ffd700', 20, 6, 5, 25);
                for (var i = 0; i < enemies.length; i++) {
                    if (Math.abs(enemies[i].x - s.x) < 100 && Math.abs(enemies[i].y - s.y) < 60) {
                        enemies[i].takeDmg(s.dmg);
                    }
                }
            }
            if (s.impact > 20) this.skySword = null;
        }
    }

    // Orbit swords (8s = 480 ticks)
    if (this.orbitOn) {
        this.orbitT--;
        this.orbitAng += 0.06;
        if (this.orbitT <= 0) this.orbitOn = false;
        for (var i = 0; i < 5; i++) {
            var a = this.orbitAng + i * Math.PI * 2 / 5;
            var ox = this.x + Math.cos(a) * 85;
            var oy = this.y + Math.sin(a) * 85;
            for (var j = 0; j < enemies.length; j++) {
                if (Math.abs(ox - enemies[j].x) < 30 && Math.abs(oy - enemies[j].y) < 35 && gameTime % 10 === 0) {
                    enemies[j].takeDmg(Math.floor(this.getAtk() * 0.6));
                }
            }
        }
    }

    // Timers
    if (this.diamondT > 0) this.diamondT--;
    if (this.bloodT > 0) this.bloodT--;

    // Movement
    if (this.hurtT <= 0 && this.dashT <= 0) {
        var mx = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) mx = -1;
        if (keys['ArrowRight'] || keys['KeyD']) mx = 1;
        if (mx) {
            this.vx = lerp(this.vx, mx * this.moveSpeed, 0.22);
            this.facing = mx;
        } else {
            this.vx *= 0.6;
        }
        if (wasPressed('ArrowUp') || wasPressed('KeyW') || wasPressed('Space')) {
            if (this.grounded) {
                this.vy = -this.jpPow;
                this.grounded = false;
                this.hasDJ = false;
                playSound('slash');
                spawnP(this.x, this.y + this.h / 2, '#fff', 4, 2, 3, 15);
            } else if (this.canDJ && !this.hasDJ) {
                this.vy = -this.jpPow * 0.85;
                this.hasDJ = true;
                playSound('slash');
                spawnP(this.x, this.y + this.h / 2, '#88ffff', 6, 2, 3, 15);
            }
        }
    }

    // Dash
    if (wasPressed('ShiftLeft') && this.dashCd <= 0 && this.dashT <= 0) {
        this.dashT = 8;
        this.dashCd = 40;
        this.vx = this.facing * 12;
        this.invT = 8;
        spawnP(this.x, this.y, '#ffd700', 8, 3, 5, 20);
        playSound('skill');
    }

    // Physics
    this.vy += 0.45;
    if (this.vy > 13) this.vy = 13;
    this.x += this.vx;
    this.y += this.vy;

    // Platform collision
    this.grounded = false;
    var self = this;
    currentLevel.plats.forEach(function(p) {
        if (self.vy >= 0 && self.x + self.w / 2 > p.x && self.x - self.w / 2 < p.x + p.w) {
            if (self.y + self.h / 2 >= p.y && self.y + self.h / 2 - self.vy <= p.y + 6) {
                self.y = p.y - self.h / 2;
                self.vy = 0;
                self.grounded = true;
            }
        }
        if (self.y + self.h / 2 > p.y + 5 && self.y - self.h / 2 < p.y + p.h) {
            if (self.x + self.w / 2 > p.x && self.x - self.w / 2 < p.x + 10 && self.vx > 0) {
                self.x = p.x - self.w / 2;
                self.vx = 0;
            }
            if (self.x - self.w / 2 < p.x + p.w && self.x + self.w / 2 > p.x + p.w - 10 && self.vx < 0) {
                self.x = p.x + p.w + self.w / 2;
                self.vx = 0;
            }
        }
    });

    this.x = clamp(this.x, this.w / 2, currentLevel.width - this.w / 2);
    if (this.y > 700) this.die();

    // Attack
    if (wasPressed('KeyJ') && this.atkCd <= 0) this.doAtk();

    // Skills
    for (var i = 0; i < this.skills.length; i++) {
        if (wasPressed(this.skills[i].k) && this.skills[i].cd <= 0 && this.mp >= this.skills[i].mp) {
            this.useSkill(i);
        }
    }

    this.updAnim();

    // Pending level ups
    if (pendingLvl > 0 && gs === ST.PLAY) {
        abChoices = pickAbils();
        abSel = 0;
        gs = ST.ASEL;
    }
};

Player.prototype.doAtk = function() {
    this.atkCd = Math.max(6, Math.floor(14 * (1 - this.atkS)));
    this.atkCombo = (this.atkCombo + 1) % 3;
    this.atkCT = 50;
    playSound('slash');

    var range = 70 + this.atkCombo * 12 + this.atkR * 40;
    var dmg = this.getAtk() + this.atkCombo * 4;

    this.atkHit.push({
        x: this.x + this.facing * 40, y: this.y - 10,
        w: range, h: 50, dmg: dmg,
        f: this.facing, life: 7, hit: {}
    });

    // Crescent sword energy projectile
    var pd = Math.floor(dmg * 0.6);
    var ps = 6 + this.atkCombo;
    sProjs.push({
        x: this.x + this.facing * 30, y: this.y - 5,
        vx: this.facing * ps, vy: 0,
        dmg: pd, life: 50, ml: 50,
        facing: this.facing, sz: 20 + this.atkCombo * 3, hit: {}
    });

    spawnP(this.x + this.facing * 40, this.y, ['#ffd700', '#ff8c00', '#fff'][this.atkCombo], 5, 3, 3, 12);
    if (this.atkCombo === 2) {
        sShake = 4;
        spawnP(this.x + this.facing * 50, this.y, '#fff', 8, 4, 4, 14);
    }

    // Double hit
    if (this.dh > 0 && Math.random() < this.dh) {
        var px = this.x + this.facing * 30;
        var pd2 = pd;
        var ps2 = ps;
        var f2 = this.facing;
        setTimeout(function() {
            sProjs.push({
                x: px, y: player.y - 5,
                vx: f2 * ps2, vy: 0,
                dmg: pd2, life: 45, ml: 45,
                facing: f2, sz: 16, hit: {}
            });
        }, 100);
    }

    // Fifth attack
    if (this.hasFA) {
        this.faCount++;
        if (this.faCount % 5 === 0) {
            for (var d = -1; d <= 1; d += 2) {
                sProjs.push({
                    x: this.x, y: this.y - 10 + d * 20,
                    vx: this.facing * 8, vy: d * 2,
                    dmg: Math.floor(dmg * 0.8), life: 40, ml: 40,
                    facing: this.facing, sz: 16, hit: {}
                });
            }
        }
    }

    // Afterimage
    if (this.hasAI) {
        for (var i = 0; i < enemies.length; i++) {
            if (Math.abs(enemies[i].x - this.x - this.facing * 50) < 60 && Math.abs(enemies[i].y - this.y) < 50) {
                enemies[i].takeDmg(Math.floor(this.getAtk() * 0.25));
            }
        }
    }
};

Player.prototype.useSkill = function(i) {
    var s = this.skills[i];
    s.cd = Math.floor(s.mc * (1 - this.cdr));
    this.mp -= s.mp;
    playSound('skill');

    switch (i) {
        case 0: // 天降神剑
            var tx = this.x + this.facing * 160;
            this.skySword = { x: tx, y: -200, ty: 480, spd: 18, dmg: Math.floor(this.getAtk() * 2), impact: 0 };
            sShake = 5;
            spawnP(tx, 200, '#ffd700', 10, 4, 4, 20);
            break;
        case 1: // 剑气环绕 8s
            this.orbitOn = true;
            this.orbitT = 480;
            this.orbitAng = 0;
            spawnP(this.x, this.y, '#88ccff', 18, 5, 4, 25);
            break;
        case 2: // 金刚不坏 10s
            this.diamondT = 600;
            spawnP(this.x, this.y, '#ffdd44', 15, 4, 4, 20);
            spawnText(this.x, this.y - 50, '金刚不坏!', '#ffdd44', 20);
            break;
        case 3: // 定身术 2s
            for (var j = 0; j < enemies.length; j++) enemies[j].frozen = 120;
            spawnP(this.x, this.y, '#aaddff', 25, 6, 5, 30);
            playSound('freeze');
            spawnText(this.x, this.y - 50, '定!', '#88ccff', 24);
            sFlash = 5; sFlashC = '#88ccff';
            break;
        case 4: // 饮血剑气 10s
            this.bloodT = 600;
            spawnP(this.x, this.y, '#ff2222', 18, 5, 4, 22);
            spawnText(this.x, this.y - 50, '饮血剑气!', '#ff4444', 20);
            break;
    }
};

Player.prototype.takeDmg = function(d) {
    if (this.invT > 0 || this.dashT > 0) return;
    if (this.dodge > 0 && Math.random() < this.dodge) {
        spawnText(this.x, this.y - 30, '闪避!', '#88ffff', 16);
        return;
    }
    var a = Math.max(1, d - this.getDef());
    a = Math.floor(a * (1 - this.dRed));
    if (this.shOn && this.shHP > 0) {
        var ab = Math.min(a, this.shHP);
        this.shHP -= ab;
        a -= ab;
        if (this.shHP <= 0) this.shOn = false;
    }
    if (a <= 0) {
        spawnP(this.x, this.y, '#88ffff', 5, 2, 3, 10);
        return;
    }
    if (this.hp - a <= 0 && this.undy > 0 && Math.random() < this.undy) {
        this.hp = 1;
        spawnText(this.x, this.y - 40, '不屈!', '#ffd700', 20);
        spawnP(this.x, this.y, '#ffd700', 15, 4, 4, 20);
        sShake = 8;
        return;
    }
    this.hp -= a;
    this.hurtT = 12;
    this.invT = 40;
    this.vy = -3.5;
    spawnText(this.x, this.y - 35, '-' + a, '#ff4444', 17);
    spawnP(this.x, this.y, '#ff4444', 7, 3, 3, 16);
    sShake = 5;
    playSound('hit');
    if (this.thorn > 0) {
        var self = this;
        enemies.forEach(function(e) {
            if (Math.abs(e.x - self.x) < 80 && Math.abs(e.y - self.y) < 80) {
                e.takeDmg(Math.floor(a * self.thorn));
            }
        });
    }
    if (this.bloodT > 0) this.hp = Math.min(this.maxHp, this.hp + Math.floor(a * 0.2));
    if (this.hp <= 0) this.die();
};

Player.prototype.die = function() {
    playSound('die');
    spawnP(this.x, this.y, '#ff2222', 22, 5, 5, 28);
    sShake = 12; sFlash = 6; sFlashC = '#ff0000';
    if (this.canRev && !this.revUsed) {
        this.revUsed = true;
        this.hp = Math.floor(this.maxHp * 0.5);
        this.invT = 90;
        spawnText(this.x, this.y - 50, '涅槃重生!', '#ffd700', 22);
        spawnP(this.x, this.y, '#ffd700', 25, 5, 5, 30);
        playSound('rev');
        sFlash = 8; sFlashC = '#ffd700';
        return;
    }
    saveGame();
    respawnTimer = 180;
    gs = ST.DEAD;
};

Player.prototype.respawn = function() {
    this.hp = this.maxHp;
    this.mp = this.maxMp;
    this.x = currentLevel.sx;
    this.y = currentLevel.sy;
    this.vx = 0;
    this.vy = 0;
    this.invT = 90;
    this.hurtT = 0;
    this.dashT = 0;
    this.atkCd = 0;
    this.revUsed = false;
    this.skySword = null;
    this.orbitOn = false;
    this.atkHit = [];
    enemies = [];
    items = [];
    sProjs = [];
    eProjs = [];
    currentLevel.wi = 0;
    currentLevel.bossed = false;
    if (currentLevel.waves.length > 0 && currentLevel.waves[0].s) {
        currentLevel.waves[0].s.forEach(function(s) { spawnEnemy(s.t, s.x, s.y); });
    }
    spawnText(this.x, this.y - 50, '复活! 成长已保留', '#00ff88', 18);
    sFlash = 6; sFlashC = '#00ff88';
    playSound('rev');
    gs = ST.PLAY;
};

Player.prototype.gainExp = function(a) {
    var ea = Math.floor(a * (1 + this.eM));
    this.exp += ea;
    while (this.exp >= this.expToNext) {
        this.exp -= this.expToNext;
        this.level++;
        this.expToNext = Math.floor(this.expToNext * 1.35);
        this.maxHp += 8;
        this.hp = this.maxHp;
        this.maxMp += 4;
        this.mp = this.maxMp;
        this.baseAtk += 2;
        this.baseDef += 1;
        sFlash = 6; sFlashC = '#ffd700';
        playSound('lvl');
        spawnText(this.x, this.y - 55, '升级! Lv.' + this.level, '#ffd700', 20);
        spawnP(this.x, this.y, '#ffd700', 20, 5, 4, 30);
        pendingLvl++;
        saveGame();
    }
};

Player.prototype.updAnim = function() {
    if (Math.abs(this.vx) > 0.5) this.state = 'run';
    else this.state = 'idle';
    if (!this.grounded) this.state = 'jump';
    if (this.hurtT > 0) this.state = 'hurt';
    if (this.dashT > 0) this.state = 'dash';
    if (this.atkCd > 7) this.state = 'atk';
};

Player.prototype.draw = function() {
    var sx = this.x - cam.x;
    var sy = this.y - cam.y;

    ctx.save();
    if (this.invT > 0 && this.invT % 4 < 2) ctx.globalAlpha = 0.4;
    drawHero(sx, sy, this.facing, this.frame, this);
    ctx.restore();

    // Sky sword visual
    if (this.skySword) {
        var s = this.skySword;
        var ssx = s.x - cam.x;
        var ssy = s.y - cam.y;
        ctx.save();
        ctx.translate(ssx, ssy);
        ctx.globalAlpha = s.impact > 0 ? 1 - s.impact / 20 : 1;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(0, -40);
        ctx.lineTo(-8, 20);
        ctx.lineTo(0, 15);
        ctx.lineTo(8, 20);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // Orbit swords
    if (this.orbitOn) {
        for (var i = 0; i < 5; i++) {
            var a = this.orbitAng + i * Math.PI * 2 / 5;
            var ox = sx + Math.cos(a) * 85;
            var oy = sy + Math.sin(a) * 85;
            ctx.save();
            ctx.translate(ox, oy);
            ctx.rotate(a + Math.PI / 2);
            ctx.shadowColor = '#88ccff';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#88ccff';
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(-4, 6);
            ctx.lineTo(0, 4);
            ctx.lineTo(4, 6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // Diamond glow
    if (this.diamondT > 0) {
        ctx.save();
        ctx.globalAlpha = 0.2 + Math.sin(gameTime * 0.15) * 0.1;
        ctx.strokeStyle = '#ffdd44';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sx, sy, 35, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // Blood aura
    if (this.bloodT > 0) {
        ctx.save();
        ctx.globalAlpha = 0.15 + Math.sin(gameTime * 0.12) * 0.08;
        ctx.fillStyle = '#ff2222';
        ctx.beginPath();
        ctx.arc(sx, sy, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Shield
    if (this.shOn) {
        ctx.save();
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = '#00aaff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx, sy, 32 + Math.sin(gameTime * 0.1) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // Attack hitbox visual
    for (var i = 0; i < this.atkHit.length; i++) {
        var h = this.atkHit[i];
        var hx = h.x - cam.x;
        ctx.save();
        ctx.globalAlpha = 0.4;
        var g = ctx.createLinearGradient(hx, 0, hx + h.w * h.f, 0);
        g.addColorStop(0, '#ffd700');
        g.addColorStop(1, 'rgba(255,215,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(h.f > 0 ? hx : hx - h.w, h.y - cam.y - 25, h.w, 50);
        ctx.restore();
    }
};

// ── Draw Hero Character ────────────────────────────────────
function drawHero(sx, sy, f, fr, p) {
    var bounce = p.state === 'run' ? Math.sin(fr * 0.12) * 2 : 0;
    var isRun = p.state === 'run';
    var isAtk = p.state === 'atk';

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + 29, 15, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cape
    ctx.save();
    ctx.translate(sx - 10 * f, sy - 8 + bounce);
    ctx.fillStyle = 'rgba(180,25,0,0.6)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-f * 16 + Math.sin(gameTime * 0.05) * 3, 16, -f * 10 + Math.sin(gameTime * 0.04) * 4, 35);
    ctx.lineTo(0, 30);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Legs
    var la = isRun ? Math.sin(fr * 0.32) * 0.4 : 0;
    for (var s = -1; s <= 1; s += 2) {
        ctx.save();
        ctx.translate(sx + s * 6 * f, sy + 15 + bounce);
        ctx.rotate(s === -1 ? la : -la);
        ctx.fillStyle = '#7a3510';
        ctx.fillRect(-3, 0, 7, 14);
        ctx.fillStyle = '#DAA520';
        ctx.beginPath();
        ctx.roundRect(-4, 12, 9, 5, 2);
        ctx.fill();
        ctx.restore();
    }

    // Body armor
    ctx.save();
    ctx.translate(sx, sy - 5 + bounce);
    var ag = ctx.createLinearGradient(-14, -18, 14, 12);
    ag.addColorStop(0, '#dd3311');
    ag.addColorStop(0.5, '#cc2200');
    ag.addColorStop(1, '#aa1100');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.roundRect(-14, -18, 28, 30, 5);
    ctx.fill();
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-14, -18, 28, 30, 5);
    ctx.stroke();
    ctx.fillStyle = '#DAA520';
    ctx.fillRect(-14, 5, 28, 4);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.roundRect(-4, 4, 8, 6, 2);
    ctx.fill();
    ctx.restore();

    // Arms + Sword
    var asw = isAtk ? (p.atkCombo === 0 ? 0.6 : p.atkCombo === 1 ? 0.9 : 1.2) * Math.sin(fr * 0.4) :
        isRun ? Math.sin(fr * 0.32) * 0.25 : 0;
    for (var s = -1; s <= 1; s += 2) {
        ctx.save();
        ctx.translate(sx + s * 12 * f, sy - 12 + bounce);
        ctx.rotate(s === -1 ? -asw * f : asw * f);
        ctx.fillStyle = '#A0522D';
        ctx.beginPath();
        ctx.roundRect(-3, 0, 7, 15, 3);
        ctx.fill();
        ctx.fillStyle = '#DAA520';
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#DEB887';
        ctx.beginPath();
        ctx.arc(0, 15, 3, 0, Math.PI * 2);
        ctx.fill();
        if (s === 1) {
            var swordCol = p.bloodT > 0 ? '#ff4444' : '#c0c0c0';
            ctx.strokeStyle = swordCol;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 3);
            ctx.lineTo(f * 40, -28);
            ctx.stroke();
            ctx.strokeStyle = p.bloodT > 0 ? 'rgba(255,50,50,0.5)' : 'rgba(255,215,0,0.5)';
            ctx.lineWidth = 5;
            ctx.shadowColor = p.bloodT > 0 ? '#ff4444' : '#ffd700';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(f * 10, -8);
            ctx.lineTo(f * 38, -26);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(f * 1 - 3, 1, 6 + f * 2, 3);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(f * 40, -28, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Head
    ctx.save();
    ctx.translate(sx, sy - 28 + bounce);
    ctx.fillStyle = '#DEB887';
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    // Headband
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(0, -7, 13, 5, 0, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = '#ff6600';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -5, 12.5, 4, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#ff2200';
    ctx.beginPath();
    ctx.arc(0, -8, 2.8, 0, Math.PI * 2);
    ctx.fill();
    // Eyes
    for (var s = -1; s <= 1; s += 2) {
        ctx.fillStyle = 'rgba(255,150,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(s * 4.5, -1, 4.2, 3.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(s * 4.5, -1, 2.8, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a0a00';
        ctx.beginPath();
        ctx.ellipse(s * 4.5 + f * 0.4, -0.5, 1.6, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    // Mouth
    if (isAtk) {
        ctx.fillStyle = '#a00';
        ctx.beginPath();
        ctx.ellipse(2 * f, 5, 3, 2, 0, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 4, 2.5, 0.1, Math.PI - 0.1);
        ctx.stroke();
    }
    // Ears
    for (var s = -1; s <= 1; s += 2) {
        ctx.fillStyle = '#DEB887';
        ctx.beginPath();
        ctx.ellipse(s * 11, -1, 3.5, 5, s * 0.25, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Dash trail
    if (p.dashT > 0) {
        ctx.save();
        ctx.globalAlpha = 0.25;
        for (var i = 1; i <= 3; i++) {
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.ellipse(sx - f * i * 14, sy, 7 - i * 2, 10 - i * 3, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

// ── Item Class ─────────────────────────────────────────────
function Item(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.vy = -2;
    this.life = 450;
    this.frame = 0;
    this.value = type === 'hp' ? 25 : type === 'mp' ? 18 : randInt(5, 12) * (1 + cycle * 0.2);
}

Item.prototype.update = function() {
    this.frame++;
    this.vy += 0.22;
    this.y += this.vy;
    var self = this;
    currentLevel.plats.forEach(function(p) {
        if (self.vy >= 0 && self.x > p.x && self.x < p.x + p.w && self.y >= p.y && self.y - self.vy < p.y + 8) {
            self.y = p.y;
            self.vy = 0;
        }
    });
    this.life--;
    if (Math.abs(this.x - player.x) < player.pR && Math.abs(this.y - player.y) < player.pR) {
        this.pick();
        return false;
    }
    return this.life > 0;
};

Item.prototype.pick = function() {
    playSound('pick');
    if (this.type === 'hp') {
        player.hp = Math.min(player.maxHp, player.hp + this.value);
        spawnText(this.x, this.y - 16, '+' + this.value + ' HP', '#00ff88', 13);
    } else if (this.type === 'mp') {
        player.mp = Math.min(player.maxMp, player.mp + this.value);
        spawnText(this.x, this.y - 16, '+' + this.value + ' MP', '#00aaff', 13);
    } else {
        var gv = Math.floor(this.value * (1 + (player.gM || 0)));
        player.gold += gv;
        spawnText(this.x, this.y - 16, '+' + gv + 'G', '#ffd700', 13);
    }
    spawnP(this.x, this.y, '#fff', 5, 2, 2, 12);
    var idx = items.indexOf(this);
    if (idx >= 0) items.splice(idx, 1);
};

Item.prototype.draw = function() {
    var sx = this.x - cam.x;
    var sy = this.y - cam.y;
    if (sx < -40 || sx > W + 40) return;
    ctx.save();
    var bob = Math.sin(this.frame * 0.06) * 3;
    ctx.globalAlpha = 0.22;
    var gc = this.type === 'hp' ? '#00ff88' : this.type === 'mp' ? '#00aaff' : '#ffd700';
    ctx.fillStyle = gc;
    ctx.beginPath();
    ctx.arc(sx, sy - 6 + bob, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (this.type === 'hp') {
        ctx.fillStyle = '#ee2222';
        ctx.beginPath();
        ctx.roundRect(sx - 4.5, sy - 12 + bob, 9, 11, 3);
        ctx.fill();
    } else if (this.type === 'mp') {
        ctx.fillStyle = '#2244ee';
        ctx.beginPath();
        ctx.roundRect(sx - 4.5, sy - 12 + bob, 9, 11, 3);
        ctx.fill();
    } else {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(sx, sy - 6 + bob, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#DAA520';
        ctx.beginPath();
        ctx.arc(sx, sy - 6 + bob, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    if (this.life < 80 && this.life % 8 < 4) ctx.globalAlpha = 0.3;
    ctx.restore();
};

// ── Collision ──────────────────────────────────────────────
function checkCol() {
    // Player attack hitboxes vs enemies
    for (var hi = 0; hi < player.atkHit.length; hi++) {
        var h = player.atkHit[hi];
        for (var ei = 0; ei < enemies.length; ei++) {
            var e = enemies[ei];
            if (h.hit[e.type + ei]) continue;
            var hl = h.f > 0 ? h.x : h.x - h.w;
            var hr = h.f > 0 ? h.x + h.w : h.x;
            if (hr > e.x - e.w / 2 && hl < e.x + e.w / 2 &&
                h.y - h.h / 2 < e.y + e.h / 2 && h.y + h.h / 2 > e.y - e.h / 2) {
                h.hit[e.type + ei] = true;
                e.takeDmg(h.dmg);
            }
        }
    }

    // Sword projectiles vs enemies
    for (var pi = 0; pi < sProjs.length; pi++) {
        var p = sProjs[pi];
        for (var ei = 0; ei < enemies.length; ei++) {
            var e = enemies[ei];
            var key = pi + '_' + ei;
            if (p.hit[key]) continue;
            if (Math.abs(p.x - e.x) < (p.sz + e.w / 2) && Math.abs(p.y - e.y) < (p.sz + e.h / 2)) {
                p.hit[key] = true;
                e.takeDmg(p.dmg);
            }
        }
    }

    // Enemy contact damage
    for (var ei = 0; ei < enemies.length; ei++) {
        var e = enemies[ei];
        if (!e.boss && !e.rg &&
            Math.abs(e.x - player.x) < (e.w / 2 + player.w / 2) &&
            Math.abs(e.y - player.y) < (e.h / 2 + player.h / 2) &&
            gameTime % 24 === 0) {
            player.takeDmg(Math.floor(e.atk * 0.5));
        }
    }
}

// ── HUD ────────────────────────────────────────────────────
function drawBar(x, y, w, h, pct, col, txt) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, y, w, h);
    if (pct > 0) {
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w * Math.max(0, pct), h);
    }
    if (txt && h >= 10) {
        ctx.fillStyle = '#fff';
        ctx.font = (h >= 12 ? 9 : 7) + 'px "ZCOOL KuaiLe"';
        ctx.textAlign = 'center';
        ctx.fillText(txt, x + w / 2, y + h - 2);
    }
}

function drawHUD() {
    ctx.save();

    // Player panel
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(10, 8, 300, 92, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,0,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(10, 8, 300, 92, 10);
    ctx.stroke();

    var ct = cycle > 0 ? '第' + (cycle + 1) + '轮 · ' : '';
    drawText('孙悟空 Lv.' + player.level + '  ' + ct + '第' + stage + '关', 20, 24, '#ffd700', 14, 'left');

    var hpP = player.hp / player.maxHp;
    var hpC = hpP > 0.5 ? '#22cc44' : hpP > 0.25 ? '#ccaa22' : '#cc2222';
    drawBar(20, 31, 215, 14, hpP, hpC, 'HP ' + Math.ceil(player.hp) + '/' + player.maxHp);
    drawBar(20, 49, 215, 12, player.mp / player.maxMp, '#2266dd', 'MP ' + Math.ceil(player.mp) + '/' + player.maxMp);
    drawBar(20, 65, 215, 9, player.exp / player.expToNext, '#aa44dd', '');

    drawText('💰' + player.gold, 242, 42, '#ffd700', 11, 'left');
    drawText('⚔' + score, 242, 58, '#aaa', 11, 'left');
    drawText('能力:' + Object.keys(player.abilityStacks).length, 242, 74, '#888', 11, 'left');

    // Skills
    var sy = H - 66;
    var ssx = W / 2 - 170;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(ssx - 6, sy - 6, 358, 52, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(ssx - 6, sy - 6, 358, 52, 10);
    ctx.stroke();

    var icons = ['剑', '环', '刚', '定', '饮'];
    for (var i = 0; i < player.skills.length; i++) {
        var s = player.skills[i];
        var x = ssx + i * 70;
        var ok = s.cd <= 0 && player.mp >= s.mp;
        ctx.fillStyle = ok ? 'rgba(255,215,0,0.12)' : 'rgba(35,35,35,0.4)';
        ctx.beginPath();
        ctx.roundRect(x, sy, 54, 36, 6);
        ctx.fill();
        ctx.strokeStyle = ok ? 'rgba(255,215,0,0.5)' : '#3a3a3a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(x, sy, 54, 36, 6);
        ctx.stroke();
        drawText(icons[i], x + 27, sy + 16, ok ? '#ffd700' : '#444', 13);
        drawText(['Z', 'X', 'C', 'V', 'B'][i], x + 27, sy + 30, '#777', 9);
        if (s.cd > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x, sy, 54, 36 * (s.cd / s.mc));
        }
    }

    // Stage info
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.roundRect(W - 200, 8, 192, 40, 8);
    ctx.fill();
    drawText((cycle > 0 ? 'X' + cycle + ' · ' : '') + currentLevel.name, W - 16, 24, '#ffd700', 13, 'right');
    drawText('敌人:' + enemies.length + ' 连击:' + combo, W - 16, 40, '#aaa', 10, 'right');

    // Boss bar
    var boss = null;
    for (var i = 0; i < enemies.length; i++) {
        if (enemies[i].boss) { boss = enemies[i]; break; }
    }
    if (boss) {
        var bw = 420, bh = 16, bx = W / 2 - bw / 2, by = 75;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(bx - 6, by - 6, bw + 12, bh + 20);
        ctx.fillStyle = '#222';
        ctx.fillRect(bx, by, bw, bh);
        var bp = boss.hp / boss.maxHp;
        ctx.fillStyle = bp > 0.5 ? '#cc0000' : bp > 0.25 ? '#ee3300' : '#ff0000';
        ctx.fillRect(bx, by, bw * bp, bh);
        drawText(boss.name + ' ' + Math.ceil(boss.hp) + '/' + Math.floor(boss.maxHp), W / 2, by + 12, '#fff', 11);
        if (boss.phase === 2) drawText('⚠ 狂暴', W / 2, by + 25, '#ff4444', 9);
    }

    // Combo
    if (combo > 1 && comboTimer > 0) {
        drawText(combo + ' COMBO!', W / 2, H / 2 - 65, '#ffd700', Math.min(36, 17 + combo));
    }

    // Active buffs
    var buffs = [];
    if (player.diamondT > 0) buffs.push({ n: '金刚', v: Math.ceil(player.diamondT / 60) + 's', c: '#ffdd44' });
    if (player.bloodT > 0) buffs.push({ n: '饮血', v: Math.ceil(player.bloodT / 60) + 's', c: '#ff4444' });
    if (player.orbitOn) buffs.push({ n: '剑环', v: Math.ceil(player.orbitT / 60) + 's', c: '#88ccff' });
    if (player.shOn) buffs.push({ n: '护盾', v: player.shHP + '', c: '#00aaff' });
    if (buffs.length > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(W - 200, 52, 192, buffs.length * 18 + 8);
        for (var i = 0; i < buffs.length; i++) {

// ── Game Initialization ────────────────────────────────────
function initStage(n) {
    stage = n;
    var d = LEVELS[n - 1];
    currentLevel = new Level(d);
    var prevLv = player ? player.level : 1;
    var prevStk = player ? JSON.parse(JSON.stringify(player.abilityStacks)) : {};
    player = new Player(d.sx, d.sy, prevLv);
    player.abilityStacks = prevStk;
    for (var id in player.abilityStacks) {
        var ab = null;
        for (var i = 0; i < ABILITIES.length; i++) {
            if (ABILITIES[i].id === id) { ab = ABILITIES[i]; break; }
        }
        if (ab) {
            for (var j = 0; j < player.abilityStacks[id]; j++) {
                applyFx(player, ab.fx);
            }
        }
    }
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    enemies = [];
    items = [];
    sProjs = [];
    eProjs = [];
    particles = [];
    combo = 0;
    comboTimer = 0;
    gameTime = 0;
    pendingLvl = 0;
    transTimer = 60;
    if (currentLevel.waves.length > 0 && currentLevel.waves[0].s) {
        currentLevel.waves[0].s.forEach(function(s) { spawnEnemy(s.t, s.x, s.y); });
        currentLevel.wi = 1;
    }
}

function startNew() {
    initAudio();
    cycle = 0;
    score = 0;
    maxCombo = 0;
    player = null;
    initStage(1);
    gs = ST.STORY;
}

function continueGame() {
    initAudio();
    var sv = loadSave();
    if (sv) {
        cycle = sv.cy || 0;
        stage = sv.st || 1;
        score = sv.sc || 0;
        maxCombo = sv.mc || 0;
        initStage(stage);
        player.level = sv.lv || 1;
        player.exp = sv.exp || 0;
        player.expToNext = sv.en || 100;
        player.gold = sv.gld || 0;
        player.abilityStacks = sv.abs || {};
        player.maxHp = 100 + (player.level - 1) * 8;
        player.maxMp = 50 + (player.level - 1) * 4;
        player.baseAtk = 15 + (player.level - 1) * 2;
        player.baseDef = 5 + (player.level - 1);
        player.moveSpeed = 1.8;
        player.jpPow = 10;
        for (var id in player.abilityStacks) {
            var ab = null;
            for (var i = 0; i < ABILITIES.length; i++) {
                if (ABILITIES[i].id === id) { ab = ABILITIES[i]; break; }
            }
            if (ab) {
                for (var j = 0; j < player.abilityStacks[id]; j++) {
                    applyFx(player, ab.fx);
                }
            }
        }
        player.hp = player.maxHp;
        player.mp = player.maxMp;
        gs = ST.PLAY;
    } else {
        startNew();
    }
}

function enterStage(n) {
    initAudio();
    cycle = 0;
    score = 0;
    maxCombo = 0;
    player = null;
    initStage(n);
    gs = ST.STORY;
}

// ── Main Update (60 ticks/sec guaranteed) ──────────────────
function update() {
    gameTime++;

    switch (gs) {
        case ST.MENU:
            var hs = hasSave();
            var mx = hs ? 4 : 3;
            if (wasPressed('ArrowUp') || wasPressed('KeyW')) menuSel = (menuSel - 1 + mx) % mx;
            if (wasPressed('ArrowDown') || wasPressed('KeyS')) menuSel = (menuSel + 1) % mx;
            if (wasPressed('Enter') || wasPressed('Space')) {
                initAudio();
                if (hs) {
                    if (menuSel === 0) continueGame();
                    else if (menuSel === 1) startNew();
                    else if (menuSel === 2) { gs = ST.SSEL; menuSel = 0; }
                    else gs = ST.CTRL;
                } else {
                    if (menuSel === 0) startNew();
                    else if (menuSel === 1) { gs = ST.SSEL; menuSel = 0; }
                    else gs = ST.CTRL;
                }
            }
            break;

        case ST.SSEL:
            if (wasPressed('ArrowLeft')) menuSel = Math.max(0, menuSel - 1);
            if (wasPressed('ArrowRight')) menuSel = Math.min(3, menuSel + 1);
            if (wasPressed('Enter') || wasPressed('Space')) enterStage(menuSel + 1);
            if (wasPressed('Escape')) { gs = ST.MENU; menuSel = 0; }
            break;

        case ST.CTRL:
            if (wasPressed('Escape')) { gs = ST.MENU; menuSel = 0; }
            break;

        case ST.STORY:
            if (gameTime > 25 && (wasPressed('Enter') || wasPressed('Space') || wasPressed('Escape'))) gs = ST.PLAY;
            break;

        case ST.PLAY:
            if (wasPressed('KeyP') || wasPressed('Escape')) { gs = ST.PAUSE; menuSel = 0; sShake = 0; break; }
            player.update();
            for (var i = 0; i < enemies.length; i++) enemies[i].update();
            for (var i = items.length - 1; i >= 0; i--) {
                if (!items[i].update()) items.splice(i, 1);
            }
            for (var i = sProjs.length - 1; i >= 0; i--) {
                sProjs[i].x += sProjs[i].vx;
                sProjs[i].y += sProjs[i].vy;
                sProjs[i].life--;
                if (sProjs[i].life <= 0) sProjs.splice(i, 1);
            }
            for (var i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) particles.splice(i, 1);
            }
            checkCol();
            updateCam(player);
            currentLevel.updateWaves();
            if (comboTimer > 0) comboTimer--; else combo = 0;
            if (sShake > 0) sShake--;
            if (sFlash > 0) sFlash--;
            if (transTimer > 0) transTimer--;
            if (currentLevel.cleared && enemies.length === 0) {
                if (stage >= 4) { cycle++; gs = ST.VIC; }
                else gs = ST.CLEAR;
                saveGame();
            }
            break;

        case ST.PAUSE:
            sShake = 0;
            if (wasPressed('KeyP') || wasPressed('Escape')) { gs = ST.PLAY; break; }
            if (wasPressed('ArrowUp') || wasPressed('KeyW')) menuSel = (menuSel - 1 + 3) % 3;
            if (wasPressed('ArrowDown') || wasPressed('KeyS')) menuSel = (menuSel + 1) % 3;
            if (wasPressed('Enter') || wasPressed('Space')) {
                if (menuSel === 0) gs = ST.PLAY;
                else if (menuSel === 1) { saveGame(); spawnText(player.x, player.y - 40, '已保存!', '#00ff88', 16); gs = ST.PLAY; }
                else { saveGame(); gs = ST.MENU; menuSel = 0; }
            }
            break;

        case ST.DEAD:
            sShake = 0;
            respawnTimer--;
            for (var i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) particles.splice(i, 1);
            }
            if (respawnTimer <= 0) player.respawn();
            break;

        case ST.CLEAR:
            if (wasPressed('Enter') || wasPressed('Space')) {
                if (stage < 4) { initStage(stage + 1); gs = ST.STORY; }
                else { cycle++; gs = ST.VIC; }
            }
            break;

        case ST.VIC:
            if (wasPressed('Enter') || wasPressed('Space')) { initStage(1); gs = ST.STORY; }
            break;

        case ST.ASEL:
            if (wasPressed('Digit1') || wasPressed('Numpad1')) abSel = 0;
            if (wasPressed('Digit2') || wasPressed('Numpad2')) abSel = 1;
            if (wasPressed('Digit3') || wasPressed('Numpad3')) abSel = 2;
            if (wasPressed('ArrowLeft')) abSel = Math.max(0, abSel - 1);
            if (wasPressed('ArrowRight')) abSel = Math.min(abChoices.length - 1, abSel + 1);
            if (wasPressed('Enter') || wasPressed('Space') || wasPressed('KeyJ')) {
                var ab = abChoices[abSel];
                if (ab) {
                    player.abilityStacks[ab.id] = (player.abilityStacks[ab.id] || 0) + 1;
                    applyFx(player, ab.fx);
                    playSound('sel');
                    spawnText(player.x, player.y - 50, ab.n + '!', '#ffd700', 18);
                    spawnP(player.x, player.y, RAR_COLS[ab.r], 12, 4, 4, 18);
                    pendingLvl--;
                    saveGame();
                    if (pendingLvl > 0) {
                        abChoices = pickAbils();
                        abSel = 0;
                    } else {
                        gs = ST.PLAY;
                    }
                }
            }
            break;
    }
}

// ── Main Draw ──────────────────────────────────────────────
function draw() {
    ctx.clearRect(0, 0, W, H);

    // Only shake during gameplay, not menus
    var doShake = sShake > 0 && (gs === ST.PLAY || gs === ST.DEAD || gs === ST.CLEAR);
    if (doShake) {
        ctx.save();
        ctx.translate(rand(-sShake, sShake), rand(-sShake, sShake));
    }

    switch (gs) {
        case ST.MENU:
            drawMenu();
            break;

        case ST.SSEL:
            drawSSEL();
            break;

        case ST.CTRL:
            drawCtrl();
            break;

        case ST.STORY:
            drawStory();
            break;

        case ST.PLAY:
        case ST.PAUSE:
        case ST.ASEL:
            currentLevel.drawBG();
            currentLevel.drawPlats();
            for (var i = 0; i < items.length; i++) items[i].draw();
            for (var i = 0; i < enemies.length; i++) enemies[i].draw();
            player.draw();

            // Crescent moon sword energy projectiles
            for (var i = 0; i < sProjs.length; i++) {
                var p = sProjs[i];
                var px = p.x - cam.x;
                var py = p.y - cam.y;
                if (px < -60 || px > W + 60) continue;
                ctx.save();
                ctx.translate(px, py);
                var angle = Math.atan2(p.vy || 0, p.vx);
                ctx.rotate(angle);
                var a = p.life / p.ml;
                ctx.globalAlpha = a;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 18 * a;

                // Crescent outer arc
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(0, 0, p.sz, -0.45, 0.45);
                ctx.arc(p.sz * 0.25, 0, p.sz * 0.5, 0.45, -0.45, true);
                ctx.closePath();
                ctx.fill();

                // Inner glow
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = a * 0.5;
                ctx.beginPath();
                ctx.arc(0, 0, p.sz * 0.35, -0.3, 0.3);
                ctx.arc(p.sz * 0.1, 0, p.sz * 0.15, 0.3, -0.3, true);
                ctx.closePath();
                ctx.fill();

                // Trail
                ctx.globalAlpha = a * 0.3;
                ctx.fillStyle = '#ffd700';
                for (var j = 1; j <= 3; j++) {
                    ctx.beginPath();
                    ctx.arc(-j * 8, 0, p.sz * (1 - j * 0.2) * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // Enemy projectiles
            for (var i = 0; i < eProjs.length; i++) {
                var p = eProjs[i];
                ctx.save();
                ctx.fillStyle = p.col;
                ctx.shadowColor = p.col;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(p.x - cam.x, p.y - cam.y, p.sz, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (var i = 0; i < particles.length; i++) particles[i].draw();
            drawHUD();

            if (gs === ST.PAUSE) drawPause();
            if (gs === ST.ASEL) drawAbSel();

            // Transition fade
            if (transTimer > 0) {
                ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, transTimer / 30) + ')';
                ctx.fillRect(0, 0, W, H);
            }
            break;

        case ST.DEAD:
            currentLevel.drawBG();
            currentLevel.drawPlats();
            player.draw();
            for (var i = 0; i < particles.length; i++) particles[i].draw();
            drawHUD();
            drawDead();
            break;

        case ST.CLEAR:
            currentLevel.drawBG();
            currentLevel.drawPlats();
            player.draw();
            for (var i = 0; i < particles.length; i++) particles[i].draw();
            drawHUD();
            drawClear();
            break;

        case ST.VIC:
            drawVic();
            break;
    }

    // Screen flash
    if (sFlash > 0) {
        ctx.save();
        ctx.globalAlpha = sFlash / 16;
        ctx.fillStyle = sFlashC;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
    }

    if (doShake) ctx.restore();
}

// ── Fixed Timestep Game Loop ───────────────────────────────
function gameLoop(timestamp) {
    if (lastTime === 0) {
        lastTime = timestamp;
    }
    var delta = timestamp - lastTime;
    lastTime = timestamp;
    if (delta > 200) delta = 200; // prevent spiral of death
    accum += delta;

    while (accum >= TICK) {
        update();
        accum -= TICK;
    }

    draw();
    requestAnimationFrame(gameLoop);
}

// ── Start ──────────────────────────────────────────────────
gs = ST.MENU;
requestAnimationFrame(gameLoop);

    </script>
